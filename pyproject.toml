[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "verl-speco"
dynamic = ["version"]
description = "Speculative decoding co-training extensions for verl"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "verl-SpeCo contributors" }]
dependencies = [
    "hydra-core>=1.3.2,<1.4",
    "omegaconf>=2.3.0,<2.4",
    "packaging>=24",
]

[project.optional-dependencies]
transfer-queue = ["TransferQueue==0.1.10"]

[project.urls]
Repository = "https://github.com/verl-project/verl-SpeCo"

[project.scripts]
verl-speco = "verl_speco.main:main"
verl-speco-standalone-data-generate = "verl_speco.standalone_data_generate:main"
verl-speco-draft-train = "verl_speco.draft_train_launcher:main"
verl-speco-inspect-features = "verl_speco.inspect_feature_store:main"
verl-speco-tq-owner = "verl_speco.tq_owner:main"
verl-speco-convert-speculators-dflash2 = "verl_speco.convert_speculators_dflash2:main"

[tool.setuptools_scm]
version_file = "verl_speco/_version.py"
parentdir_prefix_version = "verl-SpeCo-"

[tool.setuptools.packages.find]
include = ["verl_speco*"]

[tool.setuptools.package-data]
verl_speco = ["config/*.yaml"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
