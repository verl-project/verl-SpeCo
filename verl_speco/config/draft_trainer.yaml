# SPECO standalone draft trainer primary config.
#
# Shared drafter and loss defaults come from speco_base. This file only adds
# standalone launcher settings and overrides the training mode to offline.

defaults:
  - ppo_trainer
  - speco_base
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

speco:
  draft_training:
    enable: true
    launcher: python
    nproc_per_node: 1
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    standalone: true
    mode: feature_store
    # Producer and Consumer run through Ray actors / WorkerGroup.
    runtime_backend: ray
    # ray_reference sends hidden references; tq transfers complete feature tensors.
    data_transport: ray_reference
    # saved_hidden reads a standalone_raw_hidden directory through the same Consumer.
    data_source: online # online | saved_hidden
    scheduler:
      # Zero derives low from half the Producer capacity (but never below one
      # global batch), and high from the full Producer capacity.
      low_watermark_samples: 0
      high_watermark_samples: 0

actor_rollout_ref:
  rollout:
    drafter:
      enable: true
      enable_drafter_training: true
      training:
        mode: offline
        # Retain prompt context in standalone DFlash/DSpark feature samples.
        # Explicit feature/sequence/training-window limits still apply.
        preserve_prompt_hidden_states: true
        max_steps: 1000
        save_interval_steps: 100
        save_final_checkpoint: true
        eval_interval_steps: 0
        gradient_accumulation_steps: 1
        seed: 0
        nproc_per_node: ${speco.draft_training.nproc_per_node}
        nnodes: ${speco.draft_training.nnodes}
        node_rank: ${speco.draft_training.node_rank}
        master_addr: ${speco.draft_training.master_addr}
        master_port: ${speco.draft_training.master_port}
        standalone: ${speco.draft_training.standalone}
        # Independent offline-feature generation tool settings. Training itself
        # consumes complete features or scheduler-assigned streaming batches.
        target_feature_replay:
          backend: vllm_file
          model_path: null
          target_revision: null
          dtype: bfloat16
          trust_remote_code: false
          strict_target_model_path: false
          vllm_endpoint: http://localhost:8000/v1
          # Optional endpoint pool. When non-null, this takes precedence over
          # vllm_endpoint and requests use least-inflight routing with failover.
          vllm_endpoints: null
          vllm_model: null
          request_timeout: 120
          max_retries: 3
          endpoint_cooldown: 5
          on_generate: delete
          require_arange_positions: true
          # Consumer side of the vLLM hidden-state transfer. ``file`` reads the
          # legacy safetensors path; ``mooncake`` reads the handle-based store
          # written by hs_connectors.MooncakeHiddenStatesConnector.
          # Keep in sync with the producer copy in speco_base.yaml.
          hidden_states_store:
            backend: file
            mooncake:
              local_hostname: ""
              metadata_server: P2PHANDSHAKE
              master_server_address: 127.0.0.1:50051
              global_segment_size: 4294967296
              local_buffer_size: 2147483648
              protocol: tcp
              device_name: ""
              num_writer_threads: 8
          offline_generation:
            input_type: token_replay
            input_path: null
            output_path: null
            max_samples: 0
            batch_size: 1
            shuffle: false
          cache:
            enabled: false
            path: null
            max_size_gb: 0
