# Shared SPECO configuration without Hydra primary-config metadata.
#
# Keep online rollout/training defaults here so both the PPO trainer and the
# standalone draft trainer inherit the same drafter model contract.

speco:
  enable: true

  # Draft weight-update selection.  ``auto`` uses the vLLM native draft update
  # when the backend advertises capability, otherwise falls back to SPECO's
  # draft-only compat implementation.  ``native`` fails fast when the backend
  # cannot do a draft update.  ``compat`` forces the SPECO compat path.
  runtime:
    weight_update_mode: auto

  verl_base:
    version: "0.8.0"
    branch: release/v0.8.0
    supported_versions: ["0.8.0", "0.9.0"]
    supported_branches: [release/v0.8.0, release/v0.9.0]
    source_modifications_allowed: false

  compatibility:
    policy: warn
    strict_env: VERL_SPECO_STRICT_VERL
    require_verl_base_branch: release/v0.8.0
    require_verl_base_version: 0.8.0

  trainer:
    task_runner: verl_speco.integration.task_runner.SpecoTaskRunner
    ray_trainer: verl_speco.trainer.speco_ray_trainer.SpecoRayPPOTrainer

  # One-process standalone Producer. Prompt-only verl rows are generated by the
  # target vLLM; rows with a response are replayed directly for hidden states.
  standalone_tq_producer:
    input_path: null
    # Set internally by the unified launcher when model_path is a resumable
    # standalone checkpoint. Direct Producer users may leave it null.
    resume_checkpoint_path: null
    tokenizer_path: null
    tokenizer_fingerprint: null
    target_model_id: null
    target_model_revision: null
    target_layer_ids: null
    hidden_dtype: bfloat16
    trust_remote_code: false
    vllm_endpoints:
      - http://localhost:8000/v1
    vllm_model: null
    request_timeout: 120
    max_inflight_requests: 16
    per_endpoint_concurrency: 4
    input_queue_size: 32
    publish_queue_size: 16
    max_pending_samples: 1024
    # Zero means one input-file pass. The unified launcher sets this to the
    # exact number of samples required by max_steps and the global batch size.
    max_samples: 0
    # When true the Producer buffers the input file once and queues records in
    # a per-epoch permutation seeded with shuffle_seed + epoch, matching the
    # speculators rng.permutation(seed, epoch) recipe. Deterministic across
    # restarts so resumed runs replay the same per-epoch order.
    shuffle: false
    shuffle_seed: 42
    pending_poll_interval_seconds: 0.5
    # After publishing EOS the producer waits until the consumer clears every
    # published sample before closing the remote client. Bound that wait with
    # SPECO_TQ_PRODUCER_DRAIN_TIMEOUT_SECONDS (default 1800; 0 disables).
    owner_ready_timeout_seconds: 120
    max_sequence_length: 8192
    max_feature_length: 512
    generation_max_tokens: 511
    # Per endpoint: log the first three successful HTTP requests, then every N.
    # Zero disables successful-request logs; failures are always logged.
    vllm_success_log_interval: 100
    # Server-side differential rendering for the assistant loss boundary.
    # Requires a vLLM /render endpoint at the first vllm_endpoints entry.
    render_boundary:
      enabled: false
      # Per-request timeout for the tokenizer-only /render call.
      timeout: 10
    # Bad-row policy while scanning the input file: skip drops and counts an
    # unparseable row, raise aborts; max_consecutive_errors is the breaker.
    on_error: skip
    max_consecutive_errors: 20
    # Samples that fail to produce a training payload (misaligned or NaN/Inf
    # hidden states, or filtered after target generation) are replaced while
    # max_samples > 0; abort after this many consecutive replacements without a
    # successful feature conversion instead of requesting replacements forever.
    max_consecutive_feature_drops: 20
    # Tolerant role cleaning for ShareGPT rows (unknown roles map to assistant,
    # order-violating turns are dropped instead of aborting the run).
    parser_strict_roles: false
    # Filter rows whose feature window leaves too few supervised tokens.
    min_supervised_tokens: 1
    # drop|keep when the feature window cuts the supervised response.
    on_truncated_supervision: keep

actor_rollout_ref:
  rollout:
    drafter:
      enable: false
      enable_drafter_training: false
      speculative_algorithm: EAGLE3
      model_path: /path/to/drafter/model
      checkpoint_path: null
      world_size: 16

      rollout:
        spec_steps: 3
        spec_topk: 1
        spec_verify_tokens: 3
        cuda_graph_max_bs: null

      vllm:
        draft_tensor_parallel_size: null
        max_model_len: null
        enforce_eager: null
        speculative_config_overrides: {}
        # RL rollout assumes exact target-distribution verification. Set this
        # only when intentionally opting into a lossy acceptance method.
        allow_lossy_speculative_sampling: false

      training:
        mode: online
        collect_hidden_states_from_sgl: false
        collect_hidden_states_from_old_logprob: false
        # SGLang does not apply the target final norm to captured aux states.
        # Keep this false unless training and serving consistently use pre-norm.
        allow_sglang_prenorm_last_layer: false
        old_logprob_hidden_capture_impl: forward_hook
        use_data_buffer: false
        collect_interval_steps: 5
        collection_sample_rate: 1.0
        max_collect_samples_per_step_per_replica: 16
        max_collect_tokens_per_step_per_replica: 16384
        hidden_state_window_mode: front
        hidden_state_window_tokens_per_sample: 512
        hidden_state_window_min_rows: 512
        hidden_state_random_max_offset: null
        hidden_state_random_seed_by_step: true
        hidden_state_max_tokens_per_sample: null
        max_seq_len: 8192
        step: 10
        batch_size_per_gpu: 4
        training_interval_steps: 5
        publish_interval_steps: 0
        publish_async: false
        publish_dtype: null
        publish_param_name_patterns: null
        draft_update_use_shm: null
        draft_update_weights_bucket_megabytes: null
        draft_update_pause_generation: true
        draft_update_flush_before: true
        draft_update_flush_after: true
        skip_heavy_cleanup_after_drafter_training: false
        # Keep trainer objects resident while releasing idle NPU HCCL memory.
        park_hccl_after_drafter_training: false
        save_full_drafter_checkpoint: true
        sample_last_n_steps: 20
        train_batches_per_cycle: 4
        # Drafter parallelism: "fsdp2" or "ddp"; null inherits actor.strategy
        # (normally fsdp2). Prefer this over actor.strategy: upstream only
        # accepts fsdp/fsdp2/megatron/veomni for the main actor, so the
        # drafter's DDP must not go through actor.strategy.
        strategy: null
        # FSDP2 shard dimension. null keeps the training mesh as-is (online
        # co-train shards over the replica's SP size). The standalone loop
        # defaults null to 1 (replicate, no sharding); >1 shards over that many
        # ranks and -1 shards over all of them.
        fsdp_shard_size: null
        # DDP (strategy=ddp) graph traversal for unused parameters. Off by
        # default: it is only needed when a trainable param can miss a gradient.
        ddp_find_unused_parameters: false
        lr: 1e-5
        # Optimizer for drafter training. "adamw" keeps the historical single
        # AdamW over all trainable params. "muon" applies Muon to 2D hidden
        # weight matrices and AdamW to the rest (norms, biases, embeddings,
        # and output heads), mirroring speculators.train.optimizers. Muon needs
        # fsdp2 or ddp: FSDP1 shards parameters to 1D and is rejected.
        optimizer: adamw
        weight_decay: 1e-2
        # AdamW (running-momentum) betas for the non-Muon parameter group.
        adamw_betas: [0.9, 0.95]
        # Muon-only options (ignored when optimizer=adamw).
        # null uses the same lr as AdamW, matching speculators; set an explicit
        # value to override (muon_adjust_lr_fn rescales the update to AdamW RMS).
        muon_lr: null
        muon_momentum: 0.95
        muon_nesterov: true
        muon_weight_decay: 0.1
        muon_ns_steps: 5
        muon_adjust_lr_fn: match_rms_adamw
        # Extra parameter-name substrings kept on AdamW even when 2D, on top of
        # the built-in defaults (embeddings, lm_head, codebook, markov_w1/w2).
        muon_adamw_name_hints: null
        lr_warmup_steps: 0
        # Supported standalone drafter scheduler types:
        # constant, cosine, linear, global_cosine.
        lr_scheduler_type: constant
        lr_decay_steps: 100
        min_lr_ratio: 0.1
        warmup_style: null
        resume_trainer_state_from_checkpoint: true
        use_logits: false
        target_lm_head_row_restricted_sync: true
        logits_topk: 128
        logits_sparse_min_intersection: 1
        logits_sparse_min_mass: null
        logits_coverage_mask_min_ratio: 0.1
        logits_coverage_mask_require_top1: false
        ttt_length: 1
        # Group similar-length samples into a batch to cut padding. Off by
        # default because batch composition changes the loss trajectory.
        group_by_length: false
        # Samples per grouping megabatch, as a multiple of batch_size_per_gpu.
        group_by_length_megabatch: 8
        vocab_mapping_path: null
        dflash_block_size: 16
        dflash_num_anchors: 512
        dflash_loss_decay_gamma: 7.0
        dflash_front_position_weight: 1.0
        dflash_front_position_count: 0
        dflash_hard_sample_ratio: 0.0
        dflash_hidden_size: null
        dflash_num_target_layers: 5
        dflash_num_hidden_layers: 1
        dflash_mask_token_id: null
        dflash_target_layer_ids: null
        dflash_max_window: 512
        dflash_loss_mode: full_vocab
        dflash_sampled_ce_negatives: 0
        dspark_block_size: 7
        dspark_num_anchors: 32
        dspark_loss_decay_gamma: 7.0
        dspark_hard_sample_ratio: 0.0
        dspark_hidden_size: null
        dspark_intermediate_size: null
        dspark_num_target_layers: 5
        dspark_num_hidden_layers: 5
        dspark_mask_token_id: null
        dspark_target_layer_ids: null
        dspark_max_window: 512
        dspark_loss_mode: full_vocab
        dspark_sampled_ce_negatives: 0
        dspark_markov_rank: 256
        dspark_markov_head_type: vanilla
        dspark_confidence_head_alpha: 0.0
        dspark_confidence_loss_alpha: 0.0
        dspark_confidence_head_with_markov: true
        dspark_ce_loss_alpha: 0.1
        # DeepSpec Qwen3 fixed-K default. Confidence BCE is unsupported on MRV2
        # and must not implicitly reduce the distribution-matching objective.
        dspark_l1_loss_alpha: 0.9
        # auto | fused | eager. Fused uses the native CUDA/Ascend Triton kernel.
        dspark_distribution_loss_impl: auto
        # Only used by the eager fallback/reference implementation.
        dspark_l1_chunk_size: 0
        dspark_debug_log: false
        dspark_debug_log_first_n: 2
        dspark_debug_log_interval: 100
        # EAGLE3 target layers whose hidden states are concatenated as drafter input.
        eagle3_target_layer_ids: null
        # P-EAGLE (parallel drafting: COD-subsampled multi-depth forward + KL loss).
        peagle_num_draft_layers: 4
        peagle_num_aux_hidden_states: 3
        peagle_draft_vocab_size: null
        peagle_num_depths: 8
        peagle_down_sample_ratio: 0.7
        peagle_down_sample_ratio_min: 0.2
        peagle_mask_token_id: null
        peagle_fc_norm: false
        # Domino (DFlash variant: causal GRU correction head + dual-logit curriculum).
        # Unset keys fall back to the matching dflash_* value.
        domino_block_size: 16
        domino_num_anchors: 512
        domino_loss_decay_gamma: 7.0
        domino_hidden_size: null
        domino_num_target_layers: 5
        domino_num_hidden_layers: 5
        domino_mask_token_id: null
        domino_target_layer_ids: null
        domino_max_window: 512
        domino_emb_dim: 256
        domino_gru_hidden_dim: 1024
        domino_pure_draft_prefix_len: 1
        domino_shift_label: true
        domino_lambda_base_start: 1.0
        domino_lambda_base_decay_steps: 2000
        # DFlash2 (DFlash variant: two-tap dynamic depthwise convolutions around
        # each sublayer + a candidate selector that re-ranks the drafter's own
        # top-k with a low-rank bilinear score over adjacent candidates).
        # Defaults match the released z-lab/Qwen3.8-27B-DFlash2 checkpoint.
        dflash2_block_size: 8
        dflash2_num_anchors: 512
        dflash2_loss_decay_gamma: 7.0
        dflash2_hidden_size: null
        dflash2_num_target_layers: 5
        dflash2_num_hidden_layers: 5
        dflash2_mask_token_id: null
        dflash2_target_layer_ids: null
        dflash2_conv_kernel_size: 2
        dflash2_conv_group_size: 16
        dflash2_selector_rank: 256
        dflash2_selector_top_k: 16
        dflash2_selector_loss_weight: 1.0
        # EAGLE-1 / EAGLE-2 draft training (single-step feature regression +
        # full-vocab soft-CE distillation against the frozen target head).
        eagle1_num_hidden_layers: 1
        eagle1_hidden_loss_weight: 1.0
        eagle1_token_loss_weight: 0.1
        eagle1_feature_noise: 0.0
        current_max_samples: 2048
        data_buffer_max_size: 1024
        hidden_state_clip_value: 1.0e4
        feature_store:
          # `tq` selects the streaming standalone Consumer and does not use path.
          type: torch_shard
          path: null
          max_samples_per_shard: 1024
          flush_interval_steps: 1
          shuffle: true
          repeat: true
          prefetch_depth: 2
          strict_schema: true
          max_seq_len: 512
          window_mode: loss
          tokenizer_path: null
          trust_remote_code: false
          train_on: last_assistant
          min_sample_step: null
          max_sample_step: null
          # Read-side filtering for stored feature samples: skip/raise on a
          # corrupt sample, minimum supervised tokens, and alignment validation.
          on_error: skip
          max_consecutive_errors: 20
          min_supervised_tokens: 1
          strict_token_alignment: warn
        # TransferQueue transport for standalone drafter training. The owner,
        # vLLM Producer, and every torchrun Consumer rank share this connection
        # configuration. Default off; requires TransferQueue==0.1.10.
        transfer_queue:
          enable: false
          package_version: "0.1.10"
          # TQ 0.1.10 discovers its named TransferQueueController through Ray.
          # Standalone owner, Producer, and every torchrun rank must use the same
          # address and namespace.
          ray:
            address: null
            namespace: speco-drafter
          partition_id: speco_drafter_features
          run_id: null
          schema_version: 2
          expected_feature:
            algorithm: null
            target_model_path: null
            target_revision: null
            tokenizer_fingerprint: null
            target_layer_ids: null
            hidden_states_layout: null
            hidden_dtype: null
          connect_timeout_seconds: 120
          poll_interval_seconds: 0.5
          drop_last: true
          controller:
            polling_mode: true
          backend:
            storage_backend: SimpleStorage
            SimpleStorage:
              total_storage_size: 100000
              num_data_storage_units: 8
            MooncakeStore:
              # auto_init=false requires an external mooncake_master reachable
              # at master_server_address; the standalone launcher probes it and
              # fails fast otherwise. Set SPECO_TQ_MOONCAKE_AUTO_INIT=true to let
              # TransferQueue start (and own) the master instead.
              auto_init: false
              metadata_server: P2PHANDSHAKE
              master_server_address: 127.0.0.1:50051
              local_hostname: ""
              protocol: tcp
              global_segment_size: 4294967296
              local_buffer_size: 2147483648
