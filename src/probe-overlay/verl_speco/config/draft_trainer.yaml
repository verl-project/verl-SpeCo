# SPECO standalone draft trainer primary config.
#
# Shared drafter and loss defaults come from speco_base. This file only adds
# standalone launcher settings and overrides the training mode to offline.

defaults:
  - ppo_trainer
  - speco_base
  - _self_

hydra:
  searchpath:
    - pkg://verl.trainer.config

speco:
  draft_training:
    enable: true
    launcher: python
    nproc_per_node: 1
    nnodes: 1
    node_rank: null
    master_addr: null
    master_port: null
    standalone: true
    mode: feature_store
    use_ray_controller: false

actor_rollout_ref:
  rollout:
    drafter:
      enable: true
      enable_drafter_training: true
      training:
        mode: offline
        max_steps: 1000
        save_interval_steps: 100
        save_final_checkpoint: true
        eval_interval_steps: 0
        gradient_accumulation_steps: 1
        seed: 0
        nproc_per_node: ${speco.draft_training.nproc_per_node}
        nnodes: ${speco.draft_training.nnodes}
        node_rank: ${speco.draft_training.node_rank}
        master_addr: ${speco.draft_training.master_addr}
        master_port: ${speco.draft_training.master_port}
        standalone: ${speco.draft_training.standalone}
        # Standalone/offline-only reconstruction for compact token_replay stores.
        # The frozen target model is loaded lazily after the draft trainer starts.
        target_feature_replay:
          backend: torch
          model_path: null
          target_revision: null
          dtype: bfloat16
          trust_remote_code: false
          strict_target_model_path: false
          logits_chunk_rows: 32
          vllm_endpoint: http://localhost:8000/v1
          # Optional endpoint pool. When non-null, this takes precedence over
          # vllm_endpoint and requests use least-inflight routing with failover.
          vllm_endpoints: null
          vllm_model: null
          request_timeout: 120
          max_retries: 3
          endpoint_cooldown: 5
          on_generate: delete
          require_arange_positions: true
          offline_generation:
            input_type: token_replay
            input_path: null
            output_path: null
            max_samples: 0
            batch_size: 1
            shuffle: false
          cache:
            enabled: false
            path: null
            max_size_gb: 0
        # Overlap vLLM file replay with FSDP training.
        # This pipeline is standalone-only.
        target_feature_pipeline:
          enabled: false
          # Global budgets. Standalone divides them across torchrun ranks.
          concurrency: 16
          producer_prefetch_depth: 4
          prefetch_depth: 2
          queue_timeout: 300
