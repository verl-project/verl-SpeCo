name: examples_e2e_manual
run-name: Manual E2E ${{ inputs.example }} PR ${{ inputs.pr_number }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional approved PR head SHA; reject if PR changed
        required: false
        type: string
      pr_number:
        description: Optional PR number (supports forks); blank tests the selected branch
        required: false
        type: string
      example:
        description: Example script (GPU/NPU runner selected automatically)
        required: true
        type: choice
        options:
          - examples/dspark_mrv2/run_qwen3-8b_drafter_dspark_vllm_npu.sh
          - examples/run_qwen3-4b_actor_megatron_drafter_eagle3_vllm.sh
          - examples/run_qwen3-4b_actor_megatron_drafter_eagle3_vllm_npu.sh
          - examples/run_qwen3-8b_actor_veomni_drafter_dspark_vllm.sh
          - examples/run_qwen3-8b_actor_veomni_drafter_dspark_vllm_npu.sh
          - examples/run_qwen3-8b_drafter_dflash2_sglang.sh
          - examples/run_qwen3-8b_drafter_dflash2_vllm.sh
          - examples/run_qwen3-8b_drafter_dflash_sglang.sh
          - examples/run_qwen3-8b_drafter_dflash_vllm.sh
          - examples/run_qwen3-8b_drafter_dflash_vllm_npu.sh
          - examples/run_qwen3-8b_drafter_domino_peagle_separate_training.sh
          - examples/run_qwen3-8b_drafter_dspark_separate_training.sh
          - examples/run_qwen3-8b_drafter_dspark_vllm.sh
          - examples/run_qwen3-8b_drafter_dspark_vllm_npu.sh
          - examples/run_qwen3-8b_drafter_eagle3_separate_training.sh
          - examples/run_qwen3-8b_drafter_eagle3_sglang.sh
          - examples/run_qwen3-8b_drafter_eagle3_sglang_npu.sh
          - examples/run_qwen3-8b_drafter_eagle3_vllm.sh
          - examples/run_qwen3-8b_drafter_eagle3_vllm_npu.sh
          - examples/run_qwen3-8b_drafter_separate_training.sh
          - examples/run_qwen3.6-35b-a3b_drafter_dspark_separate_training.sh
      npu_image:
        description: NPU runtime image; use a compatible image for SGLang, VeOmni or native MRV2
        required: true
        default: swr.cn-north-4.myhuaweicloud.com/mindspeed/verl0.8.0_vllm_910b_speco:v1
        type: string
      verl_ref:
        description: Supported upstream verl release matching the runtime
        required: true
        default: release/v0.8.0
        type: choice
        options:
          - release/v0.8.0
          - release/v0.9.0
      environment_json:
        description: JSON environment overrides; compatible online 8B cases default to the automatic NPU models and datasets
        required: true
        default: '{}'
        type: string
      hydra_args:
        description: Optional newline-separated Hydra overrides; for two-stage examples use environment variables for shared paths
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: examples-e2e-manual-${{ inputs.pr_number || github.ref }}-${{ inputs.example }}
  cancel-in-progress: false
env:
  SPECO_DEFAULT_TARGET_MODEL: ${{ vars.SPECO_TARGET_MODEL || '/root/.cache/huggingface/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218' }}
  SPECO_DEFAULT_EAGLE3_DRAFT_MODEL: ${{ vars.SPECO_EAGLE3_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--AngelSlim--Qwen3-8B_eagle3/snapshots/9629dfce7a4a10564dd48d3e5485c3976095653c' }}
  SPECO_DEFAULT_DFLASH_DRAFT_MODEL: ${{ vars.SPECO_DFLASH_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--z-lab--Qwen3-8B-DFlash-b16/snapshots/9b41424b7109f9c5413454f481b09a82b85333f4' }}
  SPECO_DEFAULT_DSPARK_DRAFT_MODEL: ${{ vars.SPECO_DSPARK_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--deepseek-ai--dspark_qwen3_8b_block7/snapshots/03326e5043815da1f81b109078b2889737c26017' }}
  SPECO_DEFAULT_TRAIN_FILE: ${{ vars.SPECO_TRAIN_FILE || '/root/.cache/huggingface/hub/datasets--BytedTsinghua-SIA--DAPO-Math-17k/snapshots/65877096c24ffa7abc4e4fa5edb95cf3413a5674/data/dapo-math-17k.parquet' }}
  SPECO_DEFAULT_TEST_FILE: ${{ vars.SPECO_TEST_FILE || '/root/.cache/huggingface/hub/datasets--BytedTsinghua-SIA--AIME-2024/snapshots/aa49075e24ad594b79fdf0bdcefa735c2181be67/data/aime-2024.parquet' }}

jobs:
  select:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-24.04
    outputs:
      platform: ${{ steps.select.outputs.platform }}
      target_repository: ${{ steps.target.outputs.repository }}
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: target
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXAMPLE: ${{ inputs.example }}
        with:
          script: |
            const {resolveTarget} = require(process.env.GITHUB_WORKSPACE + '/ci/pr_target.cjs');
            const target = await resolveTarget({github, context, number: process.env.PR_NUMBER, expectedSha: process.env.EXPECTED_SHA});
            core.setOutput('repository', target.repository);
            core.setOutput('sha', target.sha);
            await core.summary.addHeading('Manual E2E target')
              .addRaw(`Repository: ${target.repository}\n\nCommit: ${target.sha}\n`).write();
            if (process.env.PR_NUMBER.trim()) {
              await github.rest.repos.createCommitStatus({
                ...context.repo, sha: target.sha, state: 'pending',
                context: 'manual-e2e/' + process.env.EXAMPLE,
                description: 'Waiting for selected hardware test',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }
      - id: select
        env:
          EXAMPLE: ${{ inputs.example }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          platform = json.loads(Path('ci/manual_examples.json').read_text())[os.environ['EXAMPLE']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'platform={platform}\n')
          PY

  gpu:
    needs: select
    if: needs.select.outputs.platform == 'gpu'
    runs-on: [self-hosted, linux, x64, gpu]
    environment: speco-gpu-ci
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.select.outputs.target_repository }}
          ref: ${{ needs.select.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: verl-project/verl
          ref: ${{ inputs.verl_ref }}
          path: upstream-verl
      - name: Install checkouts and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v uv >/dev/null || python -m pip install uv
          uv pip install --system --no-deps -e upstream-verl -e .
          python ci/verify_checkouts.py --expected-ref "${{ inputs.verl_ref }}"
          python -c "import torch; assert torch.cuda.is_available()"
      - name: Run selected end-to-end example
        env:
          EXAMPLE: ${{ inputs.example }}
          SPECO_CI_VARIABLES_JSON: ${{ toJSON(vars) }}
          EXAMPLE_ENVIRONMENT_JSON: ${{ inputs.environment_json }}
          EXAMPLE_HYDRA_ARGS: ${{ inputs.hydra_args }}
          PYTHONPATH: ${{ github.workspace }}
          HF_ENDPOINT: https://hf-mirror.com
          HF_HUB_ENABLE_HF_TRANSFER: '0'
        run: python ci/run_manual_example.py
      - name: Upload example logs and exit status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-e2e-gpu-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/manual-e2e/example.log
            ${{ runner.temp }}/manual-e2e/status.json
            ${{ runner.temp }}/manual-e2e/result.json
          if-no-files-found: warn

  npu:
    needs: select
    if: needs.select.outputs.platform == 'npu'
    runs-on: [linux-aarch64-a2-8]
    environment: speco-npu-ci
    timeout-minutes: 180
    container:
      image: ${{ inputs.npu_image }}
      options: --shm-size 16g
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.select.outputs.target_repository }}
          ref: ${{ needs.select.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: verl-project/verl
          ref: ${{ inputs.verl_ref }}
          path: upstream-verl
      - name: Install checkouts and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v uv >/dev/null || python -m pip install uv
          uv pip install --system --no-deps -e upstream-verl -e .
          python ci/verify_checkouts.py --expected-ref "${{ inputs.verl_ref }}"
          python -c "import torch, torch_npu; assert torch.npu.is_available()"
      - name: Run selected end-to-end example
        env:
          EXAMPLE: ${{ inputs.example }}
          SPECO_CI_VARIABLES_JSON: ${{ toJSON(vars) }}
          EXAMPLE_ENVIRONMENT_JSON: ${{ inputs.environment_json }}
          EXAMPLE_HYDRA_ARGS: ${{ inputs.hydra_args }}
          PYTHONPATH: /usr/local/Ascend/ascend-toolkit/latest/python/site-packages:/usr/local/Ascend/cann-9.0.0/python/site-packages:${{ github.workspace }}
          HF_ENDPOINT: https://hf-mirror.com
          HF_HUB_ENABLE_HF_TRANSFER: '0'
        run: python ci/run_manual_example.py
      - name: Upload example logs and exit status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-e2e-npu-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/manual-e2e/example.log
            ${{ runner.temp }}/manual-e2e/status.json
            ${{ runner.temp }}/manual-e2e/result.json
          if-no-files-found: warn

  report-pr:
    needs: [select, gpu, npu]
    if: always() && inputs.pr_number != '' && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.select.outputs.target_sha }}
          PLATFORM: ${{ needs.select.outputs.platform }}
          GPU_RESULT: ${{ needs.gpu.result }}
          NPU_RESULT: ${{ needs.npu.result }}
          EXAMPLE: ${{ inputs.example }}
        with:
          script: |
            const result = process.env.PLATFORM === 'gpu' ? process.env.GPU_RESULT : process.env.NPU_RESULT;
            const state = result === 'success' ? 'success' : result === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.TARGET_SHA, state,
              context: 'manual-e2e/' + process.env.EXAMPLE,
              description: `Selected test: ${result}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
