name: cpu_unit_tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-unit:
    name: CPU unit tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out verl-SpeCo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt

      - name: Check out supported upstream verl
        run: |
          set -euo pipefail
          verl_ref="$(awk -F= '/^VERL_BASE_BRANCH=/{print $2}' REQUIRED_VERL.txt)"
          mkdir -p .ci
          git clone --filter=blob:none https://github.com/verl-project/verl .ci/upstream-verl
          git -C .ci/upstream-verl checkout "${verl_ref}"

      - name: Install CPU test dependencies
        run: python -m pip install -r ci/requirements-ci.txt

      - name: Compile Python sources
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.ci/upstream-verl
          VERL_SPECO_UPSTREAM_ROOT: ${{ github.workspace }}/.ci/upstream-verl
        run: python -m compileall verl_speco

      - name: Validate example shell syntax
        run: find examples -type f -name "*.sh" -print0 | xargs -0 -r bash -n

      - name: Verify manual PR target resolution
        run: node --test tests/examples/test_pr_target.cjs tests/examples/test_pr_comments.cjs

      - name: Run CPU unit contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.ci/upstream-verl
          VERL_SPECO_UPSTREAM_ROOT: ${{ github.workspace }}/.ci/upstream-verl
        run: >-
          python -m pytest
          tests/compat
          tests/config
          tests/examples
          tests/integration
          -q

  unit-tests:
    name: All unit tests (torch CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out verl-SpeCo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out supported upstream verl
        run: |
          set -euo pipefail
          verl_ref="$(awk -F= '/^VERL_BASE_BRANCH=/{print $2}' REQUIRED_VERL.txt)"
          mkdir -p .ci
          git clone --filter=blob:none https://github.com/verl-project/verl .ci/upstream-verl
          git -C .ci/upstream-verl checkout "${verl_ref}"

      - name: Install CPU torch, upstream runtime deps and test dependencies
        run: |
          set -euo pipefail
          python -m pip install uv
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r ci/requirements-ci.txt -r ci/requirements-unit.txt

      - name: Run all unit and integration tests with torch
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.ci/upstream-verl
          VERL_SPECO_UPSTREAM_ROOT: ${{ github.workspace }}/.ci/upstream-verl
        run: >-
          python -m pytest
          tests/unit
          tests/v1
          tests/integration
          -q -ra

  v1-bubble:
    name: V1 Bubble contracts (verl 0.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out V1 acceptance baseline
        run: |
          mkdir -p .ci
          git clone --depth 1 --branch release/v0.9.0 https://github.com/verl-project/verl .ci/upstream-verl
      - name: Install CPU runtime
        run: |
          python -m pip install uv
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r ci/requirements-ci.txt -r ci/requirements-unit.txt
          uv pip install --system TransferQueue==0.1.10
      - name: Run real V1 mode contracts
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.ci/upstream-verl
          VERL_SPECO_UPSTREAM_ROOT: ${{ github.workspace }}/.ci/upstream-verl
          SPECO_REQUIRE_V1: "1"
        run: python -m pytest tests/v1 -q -ra

  drafter-models:
    name: Drafter model/checkpoint tests (torch CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out verl-SpeCo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out supported upstream verl
        run: |
          set -euo pipefail
          verl_ref="$(awk -F= '/^VERL_BASE_BRANCH=/{print $2}' REQUIRED_VERL.txt)"
          mkdir -p .ci
          git clone --filter=blob:none https://github.com/verl-project/verl .ci/upstream-verl
          git -C .ci/upstream-verl checkout "${verl_ref}"

      - name: Install CPU torch, upstream runtime deps and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ci/requirements-ci.txt
          python -m pip install ray peft tensordict transformers numpy pydantic
          python -m pip install -r ci/requirements-unit.txt

      - name: Run drafter model/checkpoint tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.ci/upstream-verl
          VERL_SPECO_UPSTREAM_ROOT: ${{ github.workspace }}/.ci/upstream-verl
        run: >-
          python -m pytest
          tests/integration/test_drafter_checkpoint.py
          tests/integration/test_dspark_trainer_backend.py
          --deselect "tests/integration/test_dspark_trainer_backend.py::test_dspark_checkpoint_preserves_source_config_and_vllm_weight_names"
          -q
