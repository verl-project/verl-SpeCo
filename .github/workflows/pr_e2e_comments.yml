name: PR E2E requests
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write
concurrency:
  group: pr-e2e-requests-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  request:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci ')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          CASE_SETTINGS: ${{ vars.SPECO_CI_CASE_SETTINGS_JSON || '{}' }}
        with:
          script: |
            const {handle} = require(process.env.GITHUB_WORKSPACE + '/ci/pr_comments.cjs');
            const cases = require(process.env.GITHUB_WORKSPACE + '/ci/comment_cases.json');
            await handle({github, context, cases, settings: JSON.parse(process.env.CASE_SETTINGS)});
