name: npu_vllm_unit_tests

run-name: NPU vLLM example tests (${{ github.ref_name }})

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/npu_vllm_unit_tests.yml"
      - "ci/**"
      - "examples/*vllm*.sh"
      - "verl_speco/**"
      - "pyproject.toml"
      - "REQUIRED_VERL.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/npu_vllm_unit_tests.yml"
      - "ci/**"
      - "examples/*vllm*.sh"
      - "verl_speco/**"
      - "pyproject.toml"
      - "REQUIRED_VERL.txt"
  workflow_dispatch:
    inputs:
      run_training:
        description: Enable drafter collect/train/publish inside the example run
        required: true
        default: true
        type: boolean
      target_model:
        description: Target model path or HF id; falls back to SPECO_TARGET_MODEL
        required: false
        type: string
      eagle3_draft_model:
        description: EAGLE3 drafter path; falls back to SPECO_EAGLE3_DRAFT_MODEL
        required: false
        type: string
      dflash_draft_model:
        description: DFlash drafter path; falls back to SPECO_DFLASH_DRAFT_MODEL
        required: false
        type: string
      dspark_draft_model:
        description: DSpark drafter path; falls back to SPECO_DSPARK_DRAFT_MODEL
        required: false
        type: string
      train_file:
        description: Training dataset path or HF id; falls back to SPECO_TRAIN_FILE
        required: false
        type: string
      test_file:
        description: Validation dataset path or HF id; falls back to SPECO_TEST_FILE
        required: false
        type: string
      accelerator_count:
        description: Number of NPU devices
        required: false
        default: "8"
        type: string
      tensor_parallel_size:
        description: Rollout tensor parallel size
        required: false
        default: "1"
        type: string
      sequence_parallel_size:
        description: Actor/ref sequence parallel size
        required: false
        default: "1"
        type: string
      extra_hydra_args:
        description: Optional newline-separated Hydra overrides
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npu-vllm-example-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SPECO_DEFAULT_TARGET_MODEL: ${{ vars.SPECO_TARGET_MODEL || '/root/.cache/huggingface/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218' }}
  SPECO_DEFAULT_EAGLE3_DRAFT_MODEL: ${{ vars.SPECO_EAGLE3_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--AngelSlim--Qwen3-8B_eagle3/snapshots/9629dfce7a4a10564dd48d3e5485c3976095653c' }}
  SPECO_DEFAULT_DFLASH_DRAFT_MODEL: ${{ vars.SPECO_DFLASH_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--z-lab--Qwen3-8B-DFlash-b16/snapshots/9b41424b7109f9c5413454f481b09a82b85333f4' }}
  SPECO_DEFAULT_DSPARK_DRAFT_MODEL: ${{ vars.SPECO_DSPARK_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--deepseek-ai--dspark_qwen3_8b_block7/snapshots/03326e5043815da1f81b109078b2889737c26017' }}
  SPECO_DEFAULT_TRAIN_FILE: ${{ vars.SPECO_TRAIN_FILE || '/root/.cache/huggingface/hub/datasets--BytedTsinghua-SIA--DAPO-Math-17k/snapshots/65877096c24ffa7abc4e4fa5edb95cf3413a5674/data/dapo-math-17k.parquet' }}
  SPECO_DEFAULT_TEST_FILE: ${{ vars.SPECO_TEST_FILE || '/root/.cache/huggingface/hub/datasets--BytedTsinghua-SIA--AIME-2024/snapshots/aa49075e24ad594b79fdf0bdcefa735c2181be67/data/aime-2024.parquet' }}
  SPECO_DEFAULT_ACCELERATOR_COUNT: ${{ vars.SPECO_ACCELERATOR_COUNT || '8' }}
  SPECO_DEFAULT_TENSOR_PARALLEL_SIZE: ${{ vars.SPECO_TENSOR_PARALLEL_SIZE || '1' }}
  SPECO_DEFAULT_SEQUENCE_PARALLEL_SIZE: ${{ vars.SPECO_SEQUENCE_PARALLEL_SIZE || '1' }}

jobs:
  example:
    name: NPU vLLM ${{ matrix.drafter }} example
    runs-on: [linux-aarch64-a2-8]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/mindspeed/verl0.8.0_vllm_910b_speco:v1
      options: --shm-size 16g
    timeout-minutes: 180
    environment: speco-npu-ci
    env:
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - drafter: megatron-eagle3
            enable_training: true
            disable_eagle3_torch_compile: true
          - drafter: eagle3
            enable_training: true
            disable_eagle3_torch_compile: true
          - drafter: dflash
            enable_training: true
            disable_eagle3_torch_compile: false
          - drafter: dspark
            enable_training: true
            disable_eagle3_torch_compile: false

    steps:
      - name: Check out verl-SpeCo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Check out supported verl release
        uses: actions/checkout@v4
        with:
          repository: verl-project/verl
          ref: release/v0.8.0
          path: upstream-verl
          clean: true

      - name: Install supported verl and current verl-SpeCo checkouts
        run: |
          python -m pip install --no-deps -e upstream-verl
          python -m pip install --no-deps -e .
          python - <<'PY'
          import os
          from pathlib import Path

          import verl
          import verl_speco
          from packaging.version import Version

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          verl_checkout = workspace / "upstream-verl"
          verl_package = Path(verl.__file__).resolve()
          package = Path(verl_speco.__file__).resolve()
          print("verl imported from", verl_package, "version", verl.__version__)
          print("verl_speco imported from", package)
          assert verl_checkout in verl_package.parents, (
              f"expected verl from release/v0.8.0 checkout, got {verl_package}"
          )
          assert Version(verl.__version__).base_version == "0.8.0", (
              f"expected verl 0.8.0 base version, got {verl.__version__}"
          )
          assert workspace in package.parents, (
              f"expected verl_speco from PR workspace {workspace}, got {package}"
          )
          PY

      - name: Prepare model cache
        run: |
          test -d /root/.cache/huggingface/hub
          find /root/.cache/huggingface/hub -maxdepth 5 -name config.json -print

      - name: Verify model paths
        env:
          SPECO_TARGET_MODEL: ${{ inputs.target_model || env.SPECO_DEFAULT_TARGET_MODEL }}
          SPECO_EAGLE3_DRAFT_MODEL: ${{ inputs.eagle3_draft_model || env.SPECO_DEFAULT_EAGLE3_DRAFT_MODEL }}
          SPECO_DFLASH_DRAFT_MODEL: ${{ inputs.dflash_draft_model || env.SPECO_DEFAULT_DFLASH_DRAFT_MODEL }}
          SPECO_DSPARK_DRAFT_MODEL: ${{ inputs.dspark_draft_model || env.SPECO_DEFAULT_DSPARK_DRAFT_MODEL }}
        run: |
          case "${{ matrix.drafter }}" in
            eagle3|megatron-eagle3)
              draft_model="${SPECO_EAGLE3_DRAFT_MODEL}"
              ;;
            dflash)
              draft_model="${SPECO_DFLASH_DRAFT_MODEL}"
              ;;
            dspark)
              draft_model="${SPECO_DSPARK_DRAFT_MODEL}"
              ;;
          esac

          test -d "${SPECO_TARGET_MODEL}" || {
            echo "Missing target model directory: ${SPECO_TARGET_MODEL}" >&2
            exit 2
          }
          test -d "${draft_model}" || {
            echo "Missing ${{ matrix.drafter }} draft model directory: ${draft_model}" >&2
            exit 2
          }

      - name: Verify NPU runtime
        run: |
          npu-smi info
          python - <<'PY'
          import torch
          import torch_npu
          assert torch.npu.is_available()
          print("torch.npu.device_count =", torch.npu.device_count())
          PY
          python -c "import vllm; print(vllm.__version__)"

      - name: Run example script
        env:
          PYTHONPATH: /usr/local/Ascend/ascend-toolkit/latest/python/site-packages:/usr/local/Ascend/cann-9.0.0/python/site-packages:${{ github.workspace }}
          SPECO_TARGET_MODEL: ${{ inputs.target_model || env.SPECO_DEFAULT_TARGET_MODEL }}
          SPECO_EAGLE3_DRAFT_MODEL: ${{ inputs.eagle3_draft_model || env.SPECO_DEFAULT_EAGLE3_DRAFT_MODEL }}
          SPECO_DFLASH_DRAFT_MODEL: ${{ inputs.dflash_draft_model || env.SPECO_DEFAULT_DFLASH_DRAFT_MODEL }}
          SPECO_DSPARK_DRAFT_MODEL: ${{ inputs.dspark_draft_model || env.SPECO_DEFAULT_DSPARK_DRAFT_MODEL }}
          SPECO_TRAIN_FILE: ${{ inputs.train_file || env.SPECO_DEFAULT_TRAIN_FILE }}
          SPECO_TEST_FILE: ${{ inputs.test_file || env.SPECO_DEFAULT_TEST_FILE }}
          SPECO_CKPT_DIR: ${{ vars.SPECO_CKPT_DIR || runner.temp }}
          SPECO_ACCELERATOR_COUNT: ${{ inputs.accelerator_count || env.SPECO_DEFAULT_ACCELERATOR_COUNT }}
          SPECO_TENSOR_PARALLEL_SIZE: ${{ inputs.tensor_parallel_size || env.SPECO_DEFAULT_TENSOR_PARALLEL_SIZE }}
          SPECO_SEQUENCE_PARALLEL_SIZE: ${{ inputs.sequence_parallel_size || env.SPECO_DEFAULT_SEQUENCE_PARALLEL_SIZE }}
          SPECO_ENABLE_TRAINING: ${{ matrix.enable_training && (github.event_name != 'workflow_dispatch' || inputs.run_training) && 'true' || 'false' }}
          SPECO_TOTAL_TRAINING_STEPS: ${{ vars.SPECO_TOTAL_TRAINING_STEPS || '2' }}
          SPECO_MAX_RESPONSE_LENGTH: ${{ vars.SPECO_MAX_RESPONSE_LENGTH || '512' }}
          SPECO_HIDDEN_STATE_WINDOW_MIN_ROWS: "32"
          SPECO_HIDDEN_STATE_WINDOW_TOKENS_PER_SAMPLE: "32"
          SPECO_TRAIN_BATCH_SIZE: ${{ vars.SPECO_TRAIN_BATCH_SIZE || '64' }}
          SPECO_TRAIN_MAX_SAMPLES: ${{ vars.SPECO_TRAIN_MAX_SAMPLES || '128' }}
          SPECO_VAL_MAX_SAMPLES: ${{ vars.SPECO_VAL_MAX_SAMPLES || '32' }}
          SPECO_PPO_MINI_BATCH_SIZE: ${{ vars.SPECO_PPO_MINI_BATCH_SIZE || '8' }}
          SPECO_DRAFTER_TRAINING_STEPS: ${{ vars.SPECO_DRAFTER_TRAINING_STEPS || '1' }}
          SPECO_DRAFTER_BATCH_SIZE_PER_GPU: ${{ vars.SPECO_DRAFTER_BATCH_SIZE_PER_GPU || '1' }}
          SPECO_EAGLE3_DISABLE_TORCH_COMPILE: ${{ matrix.disable_eagle3_torch_compile }}
          SPECO_TRAIN_BATCHES_PER_CYCLE: ${{ vars.SPECO_TRAIN_BATCHES_PER_CYCLE || '1' }}
          SPECO_COLLECT_INTERVAL_STEPS: ${{ vars.SPECO_COLLECT_INTERVAL_STEPS || '1' }}
          SPECO_TRAINING_INTERVAL_STEPS: ${{ vars.SPECO_TRAINING_INTERVAL_STEPS || '1' }}
          SPECO_PUBLISH_INTERVAL_STEPS: ${{ vars.SPECO_PUBLISH_INTERVAL_STEPS || '1' }}
          SPECO_DATALOADER_NUM_WORKERS: ${{ vars.SPECO_DATALOADER_NUM_WORKERS || '0' }}
          SPECO_EXTRA_HYDRA_ARGS: ${{ inputs.extra_hydra_args || vars.SPECO_EXTRA_HYDRA_ARGS }}
        run: bash ci/run_example_test.sh npu vllm "${{ matrix.drafter }}"
