name: npu_sglang_unit_tests

run-name: NPU SGLang example tests (${{ github.ref_name }})

on:
  # pull_request:
  #   branches:
  #     - main
  # push:
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      run_training:
        description: Enable drafter collect/train/publish inside the example run
        required: true
        default: true
        type: boolean
      target_model:
        description: Target model path or HF id; falls back to SPECO_TARGET_MODEL
        required: false
        type: string
      eagle3_draft_model:
        description: EAGLE3 drafter path; falls back to SPECO_EAGLE3_DRAFT_MODEL
        required: false
        type: string
      dflash_draft_model:
        description: DFlash drafter path; falls back to SPECO_DFLASH_DRAFT_MODEL
        required: false
        type: string
      dspark_draft_model:
        description: DSpark drafter path; falls back to SPECO_DSPARK_DRAFT_MODEL
        required: false
        type: string
      train_file:
        description: Training dataset path; falls back to SPECO_TRAIN_FILE
        required: false
        type: string
      test_file:
        description: Validation dataset path; falls back to SPECO_TEST_FILE
        required: false
        type: string
      accelerator_count:
        description: Number of NPU devices
        required: false
        default: "1"
        type: string
      tensor_parallel_size:
        description: Rollout tensor parallel size
        required: false
        default: "1"
        type: string
      sequence_parallel_size:
        description: Actor/ref sequence parallel size
        required: false
        default: "1"
        type: string
      extra_hydra_args:
        description: Optional newline-separated Hydra overrides
        required: false
        type: string
  # schedule:
  #   - cron: "23 19 * * 3"

permissions:
  contents: read

concurrency:
  group: npu-sglang-example-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SPECO_DEFAULT_MODEL_ROOT: ${{ vars.SPECO_MODEL_ROOT || '/home/runner/models' }}
  SPECO_DEFAULT_DATA_ROOT: ${{ vars.SPECO_DATA_ROOT || '/home/runner/models/hf_data' }}
  SPECO_DEFAULT_TARGET_MODEL: ${{ vars.SPECO_TARGET_MODEL || '/root/.cache/huggingface/hub/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218' }}
  SPECO_DEFAULT_EAGLE3_DRAFT_MODEL: ${{ vars.SPECO_EAGLE3_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--AngelSlim--Qwen3-8B_eagle3/snapshots/9629dfce7a4a10564dd48d3e5485c3976095653c' }}
  SPECO_DEFAULT_DFLASH_DRAFT_MODEL: ${{ vars.SPECO_DFLASH_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--z-lab--Qwen3-8B-DFlash-b16/snapshots/9b41424b7109f9c5413454f481b09a82b85333f4' }}
  SPECO_DEFAULT_DSPARK_DRAFT_MODEL: ${{ vars.SPECO_DSPARK_DRAFT_MODEL || '/root/.cache/huggingface/hub/models--deepseek-ai--dspark_qwen3_8b_block7/snapshots/03326e5043815da1f81b109078b2889737c26017' }}
  SPECO_DEFAULT_TRAIN_FILE: ${{ vars.SPECO_TRAIN_FILE || '/root/.cache/huggingface/hub/datasets--BytedTsinghua-SIA--DAPO-Math-17k/snapshots/65877096c24ffa7abc4e4fa5edb95cf3413a5674/data/dapo-math-17k.parquet' }}
  SPECO_DEFAULT_TEST_FILE: ${{ vars.SPECO_TEST_FILE || '/root/.cache/huggingface/hub/datasets--BytedTsinghua-SIA--AIME-2024/snapshots/aa49075e24ad594b79fdf0bdcefa735c2181be67/data/aime-2024.parquet' }}
  SPECO_DEFAULT_ACCELERATOR_COUNT: ${{ vars.SPECO_ACCELERATOR_COUNT || '1' }}
  SPECO_DEFAULT_TENSOR_PARALLEL_SIZE: ${{ vars.SPECO_TENSOR_PARALLEL_SIZE || '1' }}
  SPECO_DEFAULT_SEQUENCE_PARALLEL_SIZE: ${{ vars.SPECO_SEQUENCE_PARALLEL_SIZE || '1' }}

jobs:
  example:
    name: NPU SGLang ${{ matrix.drafter }} example
    runs-on: [linux-aarch64-a2-8]
    timeout-minutes: 180
    environment: speco-npu-ci
    strategy:
      fail-fast: false
      matrix:
        drafter:
          - eagle3
          - dflash

    steps:
      - name: Check out verl-SpeCo
        uses: actions/checkout@v4

      - name: Check out supported verl release
        uses: actions/checkout@v4
        with:
          repository: verl-project/verl
          ref: release/v0.8.0
          path: upstream-verl
      - name: Install and verify current source checkouts
        shell: bash
        run: |
          set -euo pipefail
          command -v uv >/dev/null || python -m pip install uv
          uv pip install --system --no-deps -e upstream-verl -e .
          python ci/verify_checkouts.py

      - name: Verify NPU runtime
        run: |
          npu-smi info
          python - <<'PY'
          import torch
          import torch_npu
          assert torch.npu.is_available()
          print("torch.npu.device_count =", torch.npu.device_count())
          PY
          python -c "import sglang; print(sglang.__version__)"

      - name: Run example script
        env:
          PYTHONPATH: ${{ github.workspace }}
          SPECO_TARGET_MODEL: ${{ inputs.target_model || env.SPECO_DEFAULT_TARGET_MODEL }}
          SPECO_EAGLE3_DRAFT_MODEL: ${{ inputs.eagle3_draft_model || env.SPECO_DEFAULT_EAGLE3_DRAFT_MODEL }}
          SPECO_DFLASH_DRAFT_MODEL: ${{ inputs.dflash_draft_model || env.SPECO_DEFAULT_DFLASH_DRAFT_MODEL }}
          SPECO_DSPARK_DRAFT_MODEL: ${{ inputs.dspark_draft_model || env.SPECO_DEFAULT_DSPARK_DRAFT_MODEL }}
          SPECO_TRAIN_FILE: ${{ inputs.train_file || env.SPECO_DEFAULT_TRAIN_FILE }}
          SPECO_TEST_FILE: ${{ inputs.test_file || env.SPECO_DEFAULT_TEST_FILE }}
          SPECO_CI_RESULT_PATH: ${{ runner.temp }}/speco-ci-${{ matrix.drafter }}.json
          SPECO_CKPT_DIR: ${{ vars.SPECO_CKPT_DIR || runner.temp }}
          SPECO_ACCELERATOR_COUNT: ${{ inputs.accelerator_count || env.SPECO_DEFAULT_ACCELERATOR_COUNT }}
          SPECO_TENSOR_PARALLEL_SIZE: ${{ inputs.tensor_parallel_size || env.SPECO_DEFAULT_TENSOR_PARALLEL_SIZE }}
          SPECO_SEQUENCE_PARALLEL_SIZE: ${{ inputs.sequence_parallel_size || env.SPECO_DEFAULT_SEQUENCE_PARALLEL_SIZE }}
          SPECO_ENABLE_TRAINING: ${{ (github.event_name == 'schedule' || github.event_name == 'pull_request') && 'true' || inputs.run_training }}
          SPECO_TOTAL_TRAINING_STEPS: ${{ github.event_name == 'pull_request' && '1' || vars.SPECO_TOTAL_TRAINING_STEPS }}
          SPECO_TRAIN_MAX_SAMPLES: ${{ github.event_name == 'pull_request' && '1' || vars.SPECO_TRAIN_MAX_SAMPLES }}
          SPECO_VAL_MAX_SAMPLES: ${{ github.event_name == 'pull_request' && '1' || vars.SPECO_VAL_MAX_SAMPLES }}
          SPECO_DATALOADER_NUM_WORKERS: ${{ github.event_name == 'pull_request' && '0' || vars.SPECO_DATALOADER_NUM_WORKERS }}
          SPECO_EXTRA_HYDRA_ARGS: ${{ inputs.extra_hydra_args || vars.SPECO_EXTRA_HYDRA_ARGS }}
        run: bash ci/run_example_test.sh npu sglang "${{ matrix.drafter }}"

      - name: Upload CI result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu_sglang_unit_tests-${{ matrix.drafter }}-result
          path: |
            ${{ runner.temp }}/speco-ci-${{ matrix.drafter }}.json
            ${{ runner.temp }}/speco-ci-${{ matrix.drafter }}.json.log
            ${{ runner.temp }}/speco-ci-${{ matrix.drafter }}.json.timing.json
          if-no-files-found: warn
